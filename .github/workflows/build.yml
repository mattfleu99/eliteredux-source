name: CI

on:
  push:
    branches: [ upcoming ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch submodules
        # proto/ comes from the public er-config fork listed in .gitmodules, so no deploy key is needed
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 proto

      - name: Install ARM GCC 14
        # The code builds with -std=gnu23, which apt's gcc-arm-none-eabi 13.x does not support
        run: |
          sudo apt update && sudo apt install -y libpng-dev
          curl -sSL -o /tmp/arm-gcc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          tar -xzf /tmp/arm-gcc.tar.gz -C "$HOME"
          echo "DEVKITARM=$HOME/xpack-arm-none-eabi-gcc-14.2.1-1.1" >> "$GITHUB_ENV"
          "$HOME/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-gcc" --version

      - name: Install Kotlin
        # tools/codegen compiles the proto data with kotlinc
        run: |
          curl -sSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Download poryscript
        run: cd tools && wget https://github.com/huderlem/poryscript/releases/download/3.6.1/poryscript-linux.zip && unzip poryscript-linux.zip -d ./ && rm ./poryscript-linux.zip && mv ./poryscript-linux ./poryscript && ls && cd ..
        # Downloads poryscript and unzips it

      - name: Build ER
        run: pwd && make -j$(nproc)

      - name: Download pokeemerald repo
        run: pwd && cd tools && git clone https://github.com/pret/pokeemerald
        # Clones pokeemerald repo

      - name: Install agbcc
        run: |
          pwd
          cd tools
          git clone https://github.com/pret/agbcc
          cd agbcc && ./build.sh
          ./install.sh ../pokeemerald
          cd ..
        # Downloads and installs agbcc

      - name: Build pokeemerald repo
        run: pwd && cd tools && cd pokeemerald && pwd && ls && make -j$(nproc)
        # builds agbcc to pokeemerald repo

      - name: Build the patch
        run: chmod -R 755 ./flips-linux && ls && ./flips-linux --create tools/pokeemerald/pokeemerald.gba pokeemerald_modern.gba EliteRedux.bps

      - name: Upload bps file
        uses: actions/upload-artifact@v6
        with:
          name: pokeemerald_patch
          path: EliteRedux.bps
